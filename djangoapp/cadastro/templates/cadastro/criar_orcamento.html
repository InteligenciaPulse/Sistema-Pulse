<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Orçamento</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'cadastro/css/criar_orcamento_style.css' %}">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="filter-section">
                <div class="filter-paciente">
                    <label for="paciente">Paciente</label>
                    <div class="paciente-container">
                        <input type="text" id="paciente" placeholder="Digite o nome do paciente..." oninput="buscarPacientes()">
                        <button id="novo-paciente">➕</button>
                    </div>
                    <div id="sugestoes-pacientes" class="dropdown"></div>
                </div>

                <div class="filter-procedimento">
                    <label for="procedimento">Procedimento</label>
                    <input type="text" id="procedimento" placeholder="Digite o nome do procedimento..." oninput="buscarProcedimentos()">
                    
                    <div id="sugestoes-procedimentos" class="dropdown"></div>

                    <button onclick="adicionarProcedimento()">Adicionar ao orçamento</button>

                    <div id="lista-procedimentos">
                        <h4>Procedimentos Selecionados:</h4>
                        <table id="procedimentos-table">
                            <tbody>
                                <!-- Procedimentos adicionados aparecerão aqui -->
                            </tbody>
                        </table>
                    </div>
                </div>
                
            </div>

            <label for="parceiro">Parceiro</label>
            <select id="parceiro">
                <option value="">Selecione um parceiro</option>
                <option value="parceiro1">Parceiro 1</option>
                <option value="parceiro2">Parceiro 2</option>
            </select>

            <label for="data">Data</label>
            <input type="date" id="data">

            <label for="pacote">Pacote</label>
            <select id="pacote">
                <option value="">Selecione um pacote</option>
                <option value="pacote1">Pacote 1</option>
                <option value="pacote2">Pacote 2</option>
            </select>
        </div>

        <div class="chat-container">
            <div class="header">
                <div class="chat-header">Chat</div>
                <a href="/" class="back-btn">⬅ Voltar para Home</a>
            </div>

            <div class="chat-box">
                <p><strong>IA:</strong> Como posso ajudar?</p>
            </div>
            <div class="chat-input">
                <input type="text" placeholder="Digite sua mensagem...">
                <button>Enviar</button>
            </div>
        </div>
    </div>

    <script>
        
    </script>    

    <script src="{% static 'cadastro/js/criar_orcamento_script.js' %}"></script>
    
</body>
</html>
