<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Orçamento</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'cadastro/css/criar_orcamento_style.css' %}">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="filter-section">
                <div class="filter-paciente">
                    <label for="paciente">Paciente</label>
                    <div class="paciente-container">
                        <input type="text" id="paciente" placeholder="Digite o nome do paciente...">
                        <button id="novo-paciente">➕</button>
                    </div>
                    <div id="sugestoes-pacientes" class="dropdown"></div>
                </div>

                <div id="filter-procedimento">
                    <label for="procedimento">Procedimento:</label>
                    <input type="text" id="procedimento" placeholder="Digite o nome do procedimento...">
                    <div id="sugestoes-procedimentos" class="dropdown"></div>
                    <button onclick="adicionarProcedimento()">Adicionar Procedimento</button>
                
                    <div id="lista-procedimentos">
                        <h4>Procedimentos Selecionados:</h4>
                        <div id="procedimentos-list">
                            <!-- Os procedimentos aparecerão aqui -->
                        </div>
                    </div>
                </div>

                <div id="filter-pacote">
                    <label for="pacote">Pacote:</label>
                    <input type="text" id="pacote" placeholder="Digite o nome do pacote...">
                    <div id="sugestoes-pacotes" class="dropdown"></div>
                    <button onclick="adicionarProcedimento()">Adicionar Pacotes</button>
                
                    <div id="lista-pacotes">
                        <h4>Pacotes Selecionados:</h4>
                        <div id="pacotes-list">
                            <!-- Os pacotes aparecerão aqui -->
                        </div>
                    </div>
                </div>
                
            </div>
        </div>

        <div class="chat-container">
            <div class="header">
                <div class="chat-header">Chat</div>
                <a href="/" class="back-btn">⬅ Voltar para Home</a>
            </div>

            <div class="chat-box">
                <p><strong>IA:</strong> Como posso ajudar?</p>
            </div>
            <div class="chat-input">
                <input type="text" placeholder="Digite sua mensagem...">
                <button>Enviar</button>
            </div>
        </div>
    </div>

    <script>
        
    </script>    

    <script src="{% static 'cadastro/js/criar_orcamento_script.js' %}"></script>
    
</body>
</html>
