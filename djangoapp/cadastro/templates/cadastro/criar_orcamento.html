<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Orçamento</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'cadastro/css/criar_orcamento_style.css' %}">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>Filtros</h2>

            <div class="filter-section">
                <label for="paciente">Paciente</label>
                <input type="text" id="paciente" placeholder="Digite o nome do paciente..." oninput="buscarPacientes()">
                <div id="sugestoes-pacientes" class="dropdown"></div>
                <button id="novo-paciente">➕ Cadastrar Novo Paciente</button>
            </div>

            <div id="modal-paciente" class="modal">
                <div class="modal-content">
                    <span class="close" onclick="fecharModalPaciente()">&times;</span>
                    <h3>Cadastrar Paciente</h3>
                    
                    <div class="tabs">
                        <button class="tablink active" onclick="abrirAba(event, 'dados-pessoais')">Dados Pessoais</button>
                        <button class="tablink" onclick="abrirAba(event, 'endereco')">Endereço</button>
                    </div>

                    <form id="form-paciente">
                        <div id="dados-pessoais" class="tab-content active">
                            <label>Nome:</label>
                            <input type="text" id="nome-paciente" required>
            
                            <label>CPF:</label>
                            <input type="text" id="cpf-paciente" required>
            
                            <label>Telefone:</label>
                            <input type="text" id="telefone-paciente">
            
                            <label>E-mail:</label>
                            <input type="email" id="email-paciente">
            
                            <label>Data de nascimento:</label>
                            <input type="date" id="data-nascimento-paciente">
            
                            <label>Gênero:</label>
                            <select id="genero-paciente">
                                <option value="">Selecione</option>
                                <option value="masculino">Masculino</option>
                                <option value="feminino">Feminino</option>
                                <option value="outro">Outro</option>
                            </select>
            
                            <label>Anamnese:</label>
                            <textarea id="anamnese-paciente"></textarea>
                        </div>

                        <div id="endereco" class="tab-content">
                            <label>Rua:</label>
                            <input type="text" id="rua-paciente">
            
                            <label>Número:</label>
                            <input type="text" id="numero-paciente">
            
                            <label>Bairro:</label>
                            <input type="text" id="bairro-paciente">
            
                            <label>Cidade:</label>
                            <input type="text" id="cidade-paciente">
            
                            <label>Estado:</label>
                            <input type="text" id="estado-paciente">
            
                            <label>CEP:</label>
                            <input type="text" id="cep-paciente">
            
                            <label>Complemento:</label>
                            <input type="text" id="complemento-paciente">
            
                            <label>Referência:</label>
                            <input type="text" id="referencia-paciente">
                        </div>
            
                        <button type="submit">Salvar</button>
                    </form>
                </div>
            </div>

            <label for="parceiro">Parceiro</label>
            <select id="parceiro">
                <option value="">Selecione um parceiro</option>
                <option value="parceiro1">Parceiro 1</option>
                <option value="parceiro2">Parceiro 2</option>
            </select>

            <label for="procedimento">Procedimento</label>
            <select id="procedimento">
                <option value="">Selecione um procedimento</option>
                <option value="procedimento1">Procedimento 1</option>
                <option value="procedimento2">Procedimento 2</option>
            </select>

            <label for="data">Data</label>
            <input type="date" id="data">

            <label for="pacote">Pacote</label>
            <select id="pacote">
                <option value="">Selecione um pacote</option>
                <option value="pacote1">Pacote 1</option>
                <option value="pacote2">Pacote 2</option>
            </select>

            <button>Filtrar</button>
        </div>

        <div class="chat-container">
            <div class="header">
                <div class="chat-header">Chat</div>
                <a href="/" class="back-btn">⬅ Voltar para Home</a>
            </div>

            <div class="chat-box">
                <p><strong>IA:</strong> Como posso ajudar?</p>
            </div>
            <div class="chat-input">
                <input type="text" placeholder="Digite sua mensagem...">
                <button>Enviar</button>
            </div>
        </div>
    </div>

    <script>
        
    </script>    

    <script src="{% static 'cadastro/js/criar_orcamento_script.js' %}"></script>
    
</body>
</html>
