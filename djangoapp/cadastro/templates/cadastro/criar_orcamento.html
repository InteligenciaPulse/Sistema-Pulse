{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Orçamento</title>

    <link rel="stylesheet" href="{% static 'cadastro/css/criar_orcamento_style.css' %}">
    <script src="{% static 'cadastro/js/orcamento_util.js' %}"></script>
    <script src="{% static 'cadastro/js/criar_orcamento_script.js' %}" defer></script>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="filter-section">
                <div class="status-container">
                    <label for="status">Status do Orçamento:</label>
                    <select id="status" name="status">
                        <option value="">Carregando status...</option>
                    </select>
                </div>

                <div class="filter-procedimentos">
                    <label for="procedimentos">Procedimentos</label>
                    <div id="procedimentos-specialty">
                        <input type="text" id="procedimentos" placeholder="Digite o nome do procedimento...">
                    </div>
                    <div id="sugestoes-procedimentos" class="dropdown"></div>
                    <button id= "filter-procedimentos-add-button" onclick="adicionarProcedimentos()">Adicionar procedimento</button>

                    <div id="lista-procedimentos">
                        <h4>Procedimentos Selecionados:</h4>
                        <div id="procedimentos-list">
                            <!-- Os procedimentos aparecerão aqui -->
                        </div>
                    </div>
                </div>
                
                <div class="filter-paciente">
                    <label for="paciente">Paciente</label>
                    <div class="paciente-container">
                        <input type="text" id="paciente" placeholder="Digite o nome do paciente...">
                        <button id="novo-paciente">➕</button>
                    </div>
                    <div id="sugestoes-pacientes" class="dropdown"></div>
                </div>

                <div id="filter-parceiro">
                    <label for="parceiro">Parceiro:</label>
                    <div id="parceiro-subtype">
                        <input type="text" id="parceiro" placeholder="Digite o nome do parceiro...">
                    </div>
                    <div id="sugestoes-parceiros" class="dropdown"></div>
                    <button id= "filter-parceiro-add-button" onclick="adicionarParceiro()">Adicionar parceiro</button>
                
                    <div id="lista-parceiros">
                        <h4>Parceiros Selecionados:</h4>
                        <div id="parceiros-list">
                            <!-- Os parceiros aparecerão aqui -->
                        </div>
                    </div>
                </div>

                <div class="total-container">
                    <h3 id="total-geral">Total: R$ 0,00</h3>
                    <button id="proximo-passo">Finalizar Orçamento</button>
                </div>
                
            </div>
        </div>

        <div class="chat-container">
            <div class="header">
                <div class="chat-header">Chat</div>
                <a href="/" class="back-btn">⬅ Voltar para Home</a>
            </div>

            <div class="chat-box">
                <p><strong>IA:</strong> Como posso ajudar?</p>
            </div>
            <div class="chat-input">
                <input type="text" placeholder="Digite sua mensagem...">
                <button>Enviar</button>
            </div>
        </div>
    </div>

    <!-- Modal para Cadastro de Paciente (FORA da .container) -->
    <div id="modal-paciente" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Adicionar Paciente</h2>
            <form id="form-adicionar-paciente">
                {% csrf_token %}
    
                <div class="form-row">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
    
                <div class="form-row">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" required>
                </div>
    
                <div class="form-row">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" name="telefone" required>
                </div>
    
                <div class="form-row">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email">
                </div>
    
                <div class="form-row">
                    <label for="rua">Rua:</label>
                    <input type="text" id="rua" name="rua" required>
                </div>
    
                <div class="form-row">
                    <label for="numero">Número:</label>
                    <input type="text" id="numero" name="numero" required>
                </div>
    
                <div class="form-row">
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" name="bairro" required>
                </div>
    
                <div class="form-row">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>
    
                <div class="form-row">
                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" name="estado" required>
                </div>
    
                <div class="form-row">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required>
                </div>
    
                <div class="form-row">
                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento" name="complemento">
                </div>
    
                <div class="form-row">
                    <label for="ponto_referencia">Ponto de referência:</label>
                    <input type="text" id="ponto_referencia" name="ponto_referencia">
                </div>
    
                <div class="form-row">
                    <label for="data_nascimento">Data de nascimento:</label>
                    <input type="date" id="data_nascimento" name="data_nascimento" required>
                </div>
    
                <div class="form-row">
                    <label for="genero">Gênero:</label>
                    <select id="genero" name="genero" required>
                        <option value="">Selecione...</option>
                        <option value="masculino">Masculino</option>
                        <option value="feminino">Feminino</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>
    
                <div class="form-row">
                    <label for="anamnese">Anamnese:</label>
                    <textarea id="anamnese" name="anamnese" rows="4"></textarea>
                </div>
    
                <button type="submit">Salvar Paciente</button>
            </form>
        </div>
    </div>
    
    
</body>
</html>
