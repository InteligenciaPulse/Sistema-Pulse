{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Orçamento</title>

    <link rel="stylesheet" href="{% static 'cadastro/css/criar_orcamento_style.css' %}">
    <script src="{% static 'cadastro/js/editar_orcamento_script.js' %}" defer></script>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="filter-section">
                <div class="filter-paciente">
                    <label for="paciente">Paciente</label>
                    <input type="text" id="paciente" value="{{ solicitacao.paciente.nome }}" readonly>
                </div>

                <div id="filter-parceiro">
                    <label for="parceiro">Parceiros:</label>
                    <div id="lista-parceiros">
                        {% for parceiro in parceiros %}
                            <div class="parceiro-card" data-parceiro-id="{{ parceiro.id }}">
                                <h5>{{ parceiro.nome }}</h5>
                                <button class="remover-parceiro">❌ Remover</button>

                                <div class="procedimentos-container">
                                    {% for procedimento in parceiro.procedimentos %}
                                        <div class="procedimento-item" data-id="{{ procedimento.id }}">
                                            <span>{{ procedimento.nome }}</span>
                                            <input type="number" value="{{ procedimento.valor_venda }}" class="valor-venda">
                                            <button class="remover-procedimento">❌</button>
                                        </div>
                                    {% endfor %}
                                </div>
                                <button class="adicionar-procedimento">Adicionar Procedimento</button>
                            </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="total-container">
                    <h3 id="total-geral">Total: R$ {{ valor_total }}</h3>
                    <button id="salvar-edicao">Salvar Alterações</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
